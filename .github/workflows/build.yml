name: Flutter Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android host
        run: flutter create --platforms=android --org com.tolongtukar --project-name tolongtukar_flutter .
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Preserve TolongTukar application ID and AdMob app ID
        run: |
          python - <<'PY'
          from pathlib import Path
          old_package = 'com.tolongtukar.tolongtukar_flutter'
          new_package = 'com.tolongtukar.app'
          for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
            if p.exists():
              s=p.read_text(); s=s.replace(old_package,new_package); p.write_text(s)
          activities = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if len(activities) != 1:
            raise SystemExit(f'Expected one generated MainActivity.kt, found {activities}')
          activity = activities[0]
          activity_text = activity.read_text().replace(f'package {old_package}', f'package {new_package}')
          activity_target = Path('android/app/src/main/kotlin/com/tolongtukar/app/MainActivity.kt')
          activity_target.parent.mkdir(parents=True, exist_ok=True)
          activity_target.write_text(activity_text)
          if activity != activity_target:
            activity.unlink()
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          marker='<application'
          meta='''<uses-permission android:name="android.permission.INTERNET" />\n    '''
          if 'android.permission.INTERNET' not in s: s=s.replace(marker,meta+marker)
          close='</application>'
          admob='''        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />\n    '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s: s=s.replace(close,admob+close)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify launch activity exists in APK DEX
        run: |
          python -m pip install --disable-pip-version-check androguard==4.1.4
          python tools/verify_android_startup.py build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tolongtukar-flutter-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
